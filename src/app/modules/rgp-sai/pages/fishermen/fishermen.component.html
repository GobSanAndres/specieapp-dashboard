<div class="row">
  <div class="col-md-12">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title mb-0">Tabla de Pescadores </h4>
        <div class="d-flex mt-3">
          <!-- Filtro Tipo -->
          <div class="d-flex align-items-center me-3">
            <i class="fas fa-users"></i> <!-- Icono para Tipo -->
            <select
              class="form-select ms-2"
              [(ngModel)]="currentType"
              (change)="setFilters({type: 'type', value: $event.target.value, desc: getFilterDesc('type', $event.target.value)})">
              <option [value]="">Selecciona tipo</option>
              <option value="UNO">Artesanales</option>
              <option value="DOS">Industriales</option>
              <option value="TRES">Deportivos</option>
            </select>
          </div>
        
          <!-- Filtro Ubicación -->
          <div class="d-flex align-items-center me-3">
            <i class="fas fa-map-marker-alt"></i> <!-- Icono para Ubicación -->
            <select
              class="form-select ms-2"
              [(ngModel)]="location"
              (change)="setFilters({type: 'location', value: $event.target.value, desc: getFilterDesc('location', $event.target.value)})">
              <option [value]="">Vigencia permiso</option>
              <option value="UNO">SAN ANDRÉS</option>
              <option value="DOS">PROVIDENCIAS</option>
            </select>
          </div>
        
          <!-- Filtro Vigencia -->
          <div class="d-flex align-items-center me-3">
            <i class="fas fa-calendar-check"></i> <!-- Icono para Vigencia -->
            <select
              class="form-select ms-2"
              [(ngModel)]="validity"
              (change)="setFilters({type: 'validity', value: $event.target.value, desc: getFilterDesc('validity', $event.target.value)})">
              <option [value]="">Vigencia del pescador</option>
              <option value="1">SI</option>
              <option value="0">NO</option>
            </select>
          </div>
        
          <!-- Búsqueda -->
          <div class="d-flex align-items-center">
            <input
              type="text"
              [(ngModel)]="search"
              placeholder="Buscar pescador"
              class="form-control w-auto ms-2"
              (ngModelChange)="filterFisherman()"
            />
          </div>
        </div>
        
        
        

        <div class="table-responsive">
          <table class="table table-striped no-wrap border mt-4">
            <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Foto</th>
              <th scope="col">No. permiso</th>
              <th scope="col">Nombre(s)</th>
              <th scope="col">Número de Identificación</th>
              <th scope="col">Municipio</th>
              <th scope="col">Vigencia</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let data of fishermanArray; let i = index">
              <td class="justify-content-center">{{i+1}}</td>
              <td class="justify-content-center">
                <ngx-avatar [src]="data.photo"
                            value="."
                            size="50" [round]="true">
                </ngx-avatar>
              </td>
              <td class="justify-content-center">{{data.cardNumber}}</td>
              <td class="justify-content-center">{{data.name}}</td>
              <td class="justify-content-center">{{data.identification}}</td>
              <td class="justify-content-center">{{data.location}}</td>
              <td class="justify-content-center"><span class="btn btn-rounded {{getStatus(data.validity)}}">{{getStatusDesc(data.validity)}}</span></td>
            </tr>
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-center mt-2">
          <ngb-pagination [(page)]="currentPage"
                          [pageSize]="itemsPerPage"
                          [collectionSize]="totalItems"

                          (pageChange)="paginate($event)"
          ></ngb-pagination>
        </div>
      </div>
    </div>
  </div>
</div>
